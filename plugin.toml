# A theme plugin is data only: no `wasm`, no activation, no capabilities.
# Format follows the OpenIDEA plugin manifest (`engines.openidea`); `icon` and
# `icon-dark` are plugin API 1.2, so the minimum engine is `^1.2`.
id = "huanglininn.nebula-aura"
name = "Nebula Aura Theme"
version = "1.5.4"
description = "Nebula Aura Dark, Violet, Midnight, Light and Sorbet Mint for OpenIDEA: neutral cool-grey surfaces, low-chroma borders, and pink/violet kept for accents. Sorbet Mint is the eye-comfort light variant: mint surfaces with Sorbet's teal type/keyword roles."
authors = ["Luis Mauro Penholato (original Nebula Aura Theme)", "huanglininn (OpenIDEA port)"]
homepage = "https://github.com/luismpenholato/nebula-aura-theme"
license = "MIT"
change-notes = """1.5.4 — adds Sorbet Mint, a fifth theme and the first additional light variant: mint surfaces (editor #EDF3EE, panels #E1EBE2, chrome #D5E3D7) over Cosmic Sorbet Day's syntax roles (teal keywords, deep-green strings, plum types). All 242 tokens are defined and every text token clears WCAG AA (>= 4.5:1) on all seven surfaces it can sit on, including the comment and line-number tokens the reference palette left at 4.48:1 and 3.36:1. Syntax roles are assigned by the chroma each hue can actually reach on a mint surface (purple/magenta up to 0.19, green 0.14, teal 0.08), so keyword #9a37a9, type #624dce and function #0066aa stay clearly distinct instead of collapsing into one flat grey. Diff bands are sized to OpenIDEA's three fixed alphas (28% word-compared lines, 70% whole added/deleted lines, 85% word fragments): measured on the diff surface the three hues land within 1.19x of each other (OKLab dE 0.088-0.103 at 70%), so a run of changed lines reads as one calm band instead of a solid blue wall, and syntax text on a changed line stays at 3.6:1 or better. 1.4.0 — completes all 242 themeable tokens of OpenIDEA 0.1.39 (plugin API 1.3): the four diff stripe marks (--diff-*-stripe, --diff-conflict-stripe), --syn-global, and the Python and PHP name groups. Dark, Violet and Midnight no longer paint find and go-to-result highlights in a bright amber that made syntax text unreadable (contrast 1.02): highlights now use dark backgrounds after the Islands scheme, so text is 5.0-8.1:1. Adds the plugin icons redrawn from the Nebula Aura artwork and the marketplace category. 1.3.0 — four complete themes (Dark, Violet, Midnight, Light) with neutral structural colours, accent-only pink/violet, and separated hover/current/selection states."""
categories = ["themes"]
icon = "icons/nebula-aura.svg"
icon-dark = "icons/nebula-aura-dark.svg"
engines.openidea = "^1.2"

# One entry per theme. `editor-scheme` tokens are merged over the theme's.
[[contributes.themes]]
path = "themes/nebula-aura-dark.theme.json"
editor-scheme = "themes/nebula-aura-dark.scheme.json"

[[contributes.themes]]
path = "themes/nebula-aura-violet.theme.json"
editor-scheme = "themes/nebula-aura-violet.scheme.json"

[[contributes.themes]]
path = "themes/nebula-aura-midnight.theme.json"
editor-scheme = "themes/nebula-aura-midnight.scheme.json"

[[contributes.themes]]
path = "themes/nebula-aura-light.theme.json"
editor-scheme = "themes/nebula-aura-light.scheme.json"

[[contributes.themes]]
path = "themes/nebula-aura-sorbet-mint.theme.json"
editor-scheme = "themes/nebula-aura-sorbet-mint.scheme.json"
