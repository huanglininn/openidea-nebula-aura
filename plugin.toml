# A theme plugin is data only: no `wasm`, no activation, no capabilities.
# Format follows the OpenIDEA plugin manifest (`engines.openidea`); `icon` and
# `icon-dark` are plugin API 1.2, so the minimum engine is `^1.2`.
id = "huanglininn.nebula-aura"
name = "Nebula Aura Theme"
version = "1.4.0"
description = "Nebula Aura Dark, Violet, Midnight and Light for OpenIDEA: neutral cool-grey surfaces, low-chroma borders, and pink/violet kept for accents."
authors = ["Luis Mauro Penholato (original Nebula Aura Theme)", "huanglininn (OpenIDEA port)"]
homepage = "https://github.com/luismpenholato/nebula-aura-theme"
license = "MIT"
change-notes = """1.4.0 — completes all 242 themeable tokens of OpenIDEA 0.1.39 (plugin API 1.3): the four diff stripe marks (--diff-*-stripe, --diff-conflict-stripe), --syn-global, and the Python and PHP name groups. Dark, Violet and Midnight no longer paint find and go-to-result highlights in a bright amber that made syntax text unreadable (contrast 1.02): highlights now use dark backgrounds after the Islands scheme, so text is 5.0-8.1:1. Adds the plugin icons redrawn from the Nebula Aura artwork and the marketplace category. 1.3.0 — four complete themes (Dark, Violet, Midnight, Light) with neutral structural colours, accent-only pink/violet, and separated hover/current/selection states."""
categories = ["themes"]
icon = "icons/nebula-aura.svg"
icon-dark = "icons/nebula-aura-dark.svg"
engines.openidea = "^1.2"

# One entry per theme. `editor-scheme` tokens are merged over the theme's.
[[contributes.themes]]
path = "themes/nebula-aura-dark.theme.json"
editor-scheme = "themes/nebula-aura-dark.scheme.json"

[[contributes.themes]]
path = "themes/nebula-aura-violet.theme.json"
editor-scheme = "themes/nebula-aura-violet.scheme.json"

[[contributes.themes]]
path = "themes/nebula-aura-midnight.theme.json"
editor-scheme = "themes/nebula-aura-midnight.scheme.json"

[[contributes.themes]]
path = "themes/nebula-aura-light.theme.json"
editor-scheme = "themes/nebula-aura-light.scheme.json"
