# A theme plugin is data only: no `wasm`, no activation, no capabilities.
# Format follows the OpenIDEA plugin manifest (`engines.openidea`); `icon` and
# `icon-dark` are plugin API 1.2, so the minimum engine is `^1.2`.
id = "huanglininn.nebula-aura"
name = "Nebula Aura Theme"
version = "1.5.6"
description = "Nebula Aura Dark, Violet, Midnight, Light and Sorbet Mint for OpenIDEA: neutral cool-grey surfaces, low-chroma borders, and pink/violet kept for accents. Sorbet Mint is the eye-comfort light variant: mint surfaces with Sorbet's teal type/keyword roles."
authors = ["Luis Mauro Penholato (original Nebula Aura Theme)", "huanglininn (OpenIDEA port)"]
homepage = "https://github.com/huanglininn/openidea-nebula-aura"
license = "MIT"
change-notes = """1.5.6 — Dark, Violet and Midnight: rebalance the diff change-type colours (--diff-modified/inserted/deleted) so whole-file and whole-line coarse bands (70% blend) read as a calm tint instead of a glaring wall, while fine word-compare lines (28%) and word fragments (85%) stay visible; raise syntax-role lightness/saturation so code stays readable on diff bands and selection (primary roles >= 3.3:1 on word bands, >= 7:1 on the editor background), with comments keeping a dimmer hierarchy; full readability + night-glare audit (1,420 contrast pairs per theme): every syntax, editor, UI, accent and ANSI colour clears >= 4.5:1 on normal surfaces and >= 3:1 on transient tints and stays under a 15:1 night-glare ceiling — Midnight near-white tokens dimmed to ~14.7:1 on its near-black surface, inline-value opacity raised to 70% so inline hints stay identifiable on highlights, Dark comment and fg-subtle nudged to clear 3:1. Diff stripes, Light and Sorbet Mint unchanged. 1.5.5 — metadata-only fix: the plugin homepage now points at this OpenIDEA port's repository (huanglininn/openidea-nebula-aura) instead of the original VS Code theme it was ported from. No theme changes. 1.5.4 — adds Sorbet Mint, a fifth theme and the first additional light variant: mint surfaces (editor #EDF3EE, panels #E1EBE2, chrome #D5E3D7) over Cosmic Sorbet Day's syntax roles (teal keywords, deep-green strings, plum types). All 242 tokens are defined and every text token clears WCAG AA (>= 4.5:1) on all seven surfaces it can sit on, including the comment and line-number tokens the reference palette left at 4.48:1 and 3.36:1. Syntax roles are assigned by the chroma each hue can actually reach on a mint surface (purple/magenta up to 0.19, green 0.14, teal 0.08), so keyword #9a37a9, type #624dce and function #0066aa stay clearly distinct instead of collapsing into one flat grey. Diff bands are sized to OpenIDEA's three fixed alphas (28% word-compared lines, 70% whole added/deleted lines, 85% word fragments): measured on the diff surface the three hues land within 1.19x of each other (OKLab dE 0.088-0.103 at 70%), so a run of changed lines reads as one calm band instead of a solid blue wall, and syntax text on a changed line stays at 3.6:1 or better. 1.4.0 — completes all 242 themeable tokens of OpenIDEA 0.1.39 (plugin API 1.3): the four diff stripe marks (--diff-*-stripe, --diff-conflict-stripe), --syn-global, and the Python and PHP name groups. Dark, Violet and Midnight no longer paint find and go-to-result highlights in a bright amber that made syntax text unreadable (contrast 1.02): highlights now use dark backgrounds after the Islands scheme, so text is 5.0-8.1:1. Adds the plugin icons redrawn from the Nebula Aura artwork and the marketplace category. 1.3.0 — four complete themes (Dark, Violet, Midnight, Light) with neutral structural colours, accent-only pink/violet, and separated hover/current/selection states."""
categories = ["themes"]
icon = "icons/nebula-aura.svg"
icon-dark = "icons/nebula-aura-dark.svg"
engines.openidea = "^1.2"

# One entry per theme. `editor-scheme` tokens are merged over the theme's.
[[contributes.themes]]
path = "themes/nebula-aura-dark.theme.json"
editor-scheme = "themes/nebula-aura-dark.scheme.json"

[[contributes.themes]]
path = "themes/nebula-aura-violet.theme.json"
editor-scheme = "themes/nebula-aura-violet.scheme.json"

[[contributes.themes]]
path = "themes/nebula-aura-midnight.theme.json"
editor-scheme = "themes/nebula-aura-midnight.scheme.json"

[[contributes.themes]]
path = "themes/nebula-aura-light.theme.json"
editor-scheme = "themes/nebula-aura-light.scheme.json"

[[contributes.themes]]
path = "themes/nebula-aura-sorbet-mint.theme.json"
editor-scheme = "themes/nebula-aura-sorbet-mint.scheme.json"
